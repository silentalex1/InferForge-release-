[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferforge"
version = "0.2.1"
description = "InferForge — a faster local LLM runtime. Forge models. Run them. No friction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "InferForge" }]
keywords = ["llm", "local-ai", "ollama", "gguf", "inference", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "uvicorn>=0.30",
  "fastapi>=0.111",
  "orjson>=3.10",
  "platformdirs>=4.2",
  "boto3>=1.34",
  "aiobotocore>=2.12",
  "aiofiles>=24.1",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "ruff>=0.5",
  "mypy>=1.8",
  "black>=24.0",
]
native = ["llama-cpp-python>=0.3", "torch>=2.4", "transformers>=4.44"]
training = ["torch>=2.4", "transformers>=4.44", "datasets>=2.0", "accelerate>=0.20", "peft>=0.8"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.scripts]
forge = "inferforge.cli:forge"
run = "inferforge.cli:run_cmd"

[project.urls]
Homepage = "https://github.com/inferforge/inferforge"
Documentation = "https://github.com/inferforge/inferforge#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
