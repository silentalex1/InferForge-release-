<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HyperNeural Chatroom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0e1b3d; --panel: rgba(255,255,255,0.04); --line: rgba(255,255,255,0.10);
    --text: #ffffff; --dim: rgba(255,255,255,0.5); --amber: #fbbf24;
    --ok: #34d399; --bad: #fb7185; --warn: #fbbf24;
  }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.18); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .brand .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--amber); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
  .brand small { font-weight: 500; color: var(--dim); font-size: 12px; }
  .model { display: flex; align-items: center; gap: 8px; font-family: ui-monospace, monospace; font-size: 13px; color: rgba(255,255,255,0.75); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.online { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.hosted { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
  .dot.offline { background: var(--bad); }
  .dot.private { background: var(--warn); }
  .status-text { font-size: 12px; color: var(--dim); }
  main { flex: 1; display: flex; flex-direction: column; max-width: 760px; width: 100%; margin: 0 auto; padding: 20px 18px 12px; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--dim); padding-bottom: 14px; }
  .stats b { color: rgba(255,255,255,0.8); font-weight: 600; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); min-height: 320px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.you { align-self: flex-end; background: var(--amber); color: var(--bg); border-bottom-right-radius: 4px; font-weight: 500; }
  .msg.ai { align-self: flex-start; background: rgba(255,255,255,0.07); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: transparent; border: 1px dashed var(--line); color: var(--dim); font-size: 12.5px; text-align: center; }
  .msg.err { align-self: center; background: rgba(251,113,133,0.08); border: 1px solid rgba(251,113,133,0.3); color: #fecdd3; font-size: 13px; }
  form { display: flex; gap: 10px; padding: 14px 0 6px; }
  input[type=text] { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); color: var(--text); font: inherit; outline: none; }
  input[type=text]:focus { border-color: rgba(251,191,36,0.5); }
  input[type=text]:disabled { opacity: 0.5; }
  button { padding: 12px 22px; border-radius: 12px; border: none; background: var(--amber); color: var(--bg); font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  footer { text-align: center; padding: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
  footer a { color: rgba(251,191,36,0.7); text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">H</span>
    <span>HyperNeural <small>chatroom · InferForge bridge</small></span>
  </div>
  <div class="model">
    <span id="dot" class="dot"></span>
    <span id="model-name">connecting…</span>
    <span id="status-text" class="status-text"></span>
  </div>
</header>
<main>
  <div class="stats" id="stats">
    <span>status <b id="st-status">checking…</b></span>
    <span>requests today <b id="st-today">0</b></span>
    <span>total <b id="st-total">0</b></span>
    <span>last request <b id="st-last">never</b></span>
  </div>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask the model…" autocomplete="off" disabled />
    <button id="send" type="submit" disabled>Send</button>
  </form>
</main>
<footer>hosted on <a href="https://hyperneural.cfd">hyperneural.cfd</a> · powered by <a href="https://inferforge.org">inferforge.org</a></footer>
<script>
(function () {
  var API = "https://inferforge.org";
  var segs = location.pathname.split("/").filter(Boolean);
  var slug = decodeURIComponent(segs[1] || "");
  var urlKey = new URLSearchParams(location.search).get("key") || "";
  var record = null;
  var history = [];
  var busy = false;

  var log = document.getElementById("log");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var dot = document.getElementById("dot");
  var modelName = document.getElementById("model-name");
  var statusText = document.getElementById("status-text");

  function ago(iso) {
    if (!iso) return "never";
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (isNaN(s) || s < 0) return "never";
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  }

  function push(cls, text) {
    var div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function setStatus(status) {
    var cls = status === "online" ? "online" : status === "hosted" ? "hosted" : "offline";
    dot.className = "dot " + cls;
    var label = status === "online" ? "online, own weights" : status === "hosted" ? "hosted on cloud" : "offline";
    document.getElementById("st-status").textContent = label;
    statusText.textContent = "· " + label;
  }
  function refreshStats() {
    fetch(API + "/api/sdk/models?slug=" + encodeURIComponent(slug), { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (body) {
        if (!body || !body.models) return;
        var found = null;
        for (var i = 0; i < body.models.length; i++) {
          if (body.models[i].slug === slug) { found = body.models[i]; break; }
        }
        if (!found) return;
        record = found;
        modelName.textContent = found.model;
        setStatus(found.status);
        document.getElementById("st-today").textContent = found.requests.today || 0;
        document.getElementById("st-total").textContent = found.requests.total || 0;
        document.getElementById("st-last").textContent = ago(found.requests.last_request_at);
        if (!send.disabled || !input.disabled) return;
        input.disabled = false;
        send.disabled = false;
        input.focus();
      })
      .catch(function () {});
  }

  function readStream(res, onDelta, onDone, onErr) {
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buf = "";
    function step() {
      reader.read().then(function (r) {
        if (r.done) { onDone(); return; }
        buf += decoder.decode(r.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop() || "";
        for (var i = 0; i < lines.length; i++) {
          var t = lines[i].trim();
          if (!t || t.indexOf("data:") !== 0) continue;
          var payload = t.slice(5).trim();
          if (payload === "[DONE]") { onDone(); return; }
          try {
            var chunk = JSON.parse(payload);
            var d = chunk.choices && chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content;
            if (d) onDelta(d);
          } catch (e) {}
        }
        step();
      }, onErr);
    }
    step();
  }

  function chat(messages, key, onDelta) {
    var body = JSON.stringify({ model: (record && record.model) || slug, messages: messages, stream: true });
    return fetch(API + "/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key, "Accept": "text/event-stream" },
      body: body
    }).then(function (res) {
      var ct = res.headers.get("content-type") || "";
      if (res.ok && ct.indexOf("event-stream") >= 0 && res.body) {
        return new Promise(function (resolve, reject) {
          readStream(res, onDelta, resolve, reject);
        });
      }
      return res.json().then(function (j) {
        if (!res.ok) {
          var err = new Error(j.message || j.error || ("HTTP " + res.status));
          err.code = j.error;
          throw err;
        }
        var txt = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (txt) onDelta(txt);
        return txt || "";
      });
    });
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var q = input.value.trim();
    if (!q) return;
    input.value = "";
    var key = urlKey || (record && record.key) || "";
    push("you", q);
    history.push({ role: "user", content: q });
    var bubble = push("ai", "…");
    busy = true;
    send.disabled = true;
    var acc = "";
    var onDelta = function (d) {
      acc += d;
      bubble.textContent = acc;
      log.scrollTop = log.scrollHeight;
    };
    var done = function () {
      busy = false;
      send.disabled = false;
      if (acc) history.push({ role: "assistant", content: acc });
      if (!acc) bubble.textContent = "(empty response)";
      input.focus();
    };
    chat(history.slice(), key, onDelta)
      .then(done)
      .catch(function (err) {
        busy = false;
        send.disabled = false;
        bubble.textContent = "";
        bubble.className = "msg err";
        bubble.textContent = "The model is not reachable right now: " + (err.message || "request failed");
        history.pop();
      });
  });
  if (!slug) {
    push("sys", "No model in this link. Use hyperneural.cfd/chatroom/<model>");
    document.getElementById("st-status").textContent = "no model";
  } else {
    push("sys", "Connecting to " + slug + " …");
    refreshStats();
    setInterval(refreshStats, 15000);
  }
})();
</script>
</body>
</html>
